name: Peer core
on:
  push:
    branches: [main]
    paths: ['app-android/core/**', 'app-android/engine/**', '.github/workflows/peer.yml']
  pull_request:
    paths: ['app-android/core/**', 'app-android/engine/**', '.github/workflows/peer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-android/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app-android/core/go.mod
          cache-dependency-path: |
            app-android/core/go.sum
            app-android/engine/go.sum
      - run: go test -race ./... -timeout 90s
      - run: go vet ./...
      - run: go build ./cmd/peer-node ./cmd/peer-service
      - name: Android physical network adapter tests
        working-directory: app-android/engine
        run: go test -race -ldflags=-checklinkname=0 ./mgbox -timeout 90s
      - name: Android adapter vet
        working-directory: app-android/engine
        run: go vet ./mgbox
