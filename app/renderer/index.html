<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>magnetgate</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
      --fg: #e6e8ee; --muted: #8b93a7; --accent: #4ea1ff; --ok: #37d67a; --off: #6b7280; --warn: #f5a524; --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 system-ui, Segoe UI, sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 15px; margin: 0; letter-spacing: .3px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); }
    .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    main { padding: 14px 16px; display: grid; gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
    .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 10px; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
    .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
    .stat .v { font-size: 15px; margin-top: 2px; font-variant-numeric: tabular-nums; }
    button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }
    button.danger { border-color: var(--err); color: #ffb4b4; }
    input, textarea { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font: inherit; width: 100%; }
    textarea { resize: vertical; min-height: 54px; font-family: ui-monospace, Consolas, monospace; }
    label { color: var(--muted); font-size: 11px; display: block; margin-bottom: 4px; }
    .exits { display: grid; gap: 8px; }
    .exit { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; align-items: end; }
    .field { display: flex; flex-direction: column; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #log { background: #0a0c10; border: 1px solid var(--line); border-radius: 8px; padding: 10px; height: 190px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #c6ccd8; }
    .muted { color: var(--muted); }
    .err { color: var(--err); }
    .spacer { flex: 1; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
    .pill.on { color: var(--ok); border-color: var(--ok); }
  </style>
</head>
<body>
  <header>
    <span id="dot" class="dot"></span>
    <h1>magnetgate</h1>
    <span class="spacer"></span>
    <span id="vpnPill" class="pill">VPN off</span>
  </header>
  <main>
    <section class="card">
      <h2>Status</h2>
      <div class="grid">
        <div class="stat"><div class="k">Client</div><div class="v" id="sClient">stopped</div></div>
        <div class="stat"><div class="k">Route</div><div class="v" id="sRoute">—</div></div>
        <div class="stat"><div class="k">Egress IP</div><div class="v" id="sEgress">—</div></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="btnClient" class="primary">Start client</button>
        <button id="btnVpn">Enable system VPN</button>
        <span class="spacer"></span>
        <span id="err" class="err"></span>
      </div>
      <p class="muted" style="margin:10px 0 0">System VPN routes all traffic through the tunnel (kill-switch, IPv6 blocked, DNS via tunnel) and asks for admin (UAC). Turn off any other full-tunnel VPN first.</p>
    </section>

    <section class="card">
      <h2>Configuration</h2>
      <div class="exits" id="exits"></div>
      <div class="row" style="margin:10px 0">
        <button id="btnAddExit">+ Add exit</button>
        <span class="spacer"></span>
      </div>
      <div class="two">
        <div class="field"><label>SOCKS port (localPort)</label><input id="localPort" type="number" /></div>
        <div class="field"><label>sing-box SOCKS port</label><input id="singboxPort" type="number" /></div>
      </div>
      <div class="field" style="margin-top:10px"><label>DHT bootstrap (one host:port per line)</label><textarea id="bootstrap"></textarea></div>
      <div class="row" style="margin-top:12px">
        <button id="btnSave" class="primary">Save config</button>
        <button id="btnOpenDir">Open config folder</button>
        <span class="spacer"></span>
        <span id="saved" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between; align-items:baseline">
        <h2 style="margin:0">Log</h2>
        <button id="btnLogs">Open logs folder</button>
      </div>
      <p class="muted" id="logPath" style="margin:6px 0 8px; font-family:ui-monospace,Consolas,monospace; font-size:11px; word-break:break-all"></p>
      <div id="log"></div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
